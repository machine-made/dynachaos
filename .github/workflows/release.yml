name: Publish to PyPI

# Tag-triggered so a release cannot happen without a tag recording which commit
# shipped. 0.4.0 was published from a workflow_dispatch run and left no tag at
# all, so there was no way to check out the source that produced it.
#
# The old `type "publish" to confirm` input is replaced by checks that can
# actually fail for a real reason: the tag must match the packaged version, and
# the version must not already exist on PyPI. Pushing a version tag is itself a
# deliberate act, and the `pypi` environment on the publish job remains the
# place to add an approval gate.
on:
  push:
    tags: ["v*"]

# Least privilege by default. Only the publish job mints an OIDC token.
permissions:
  contents: read

jobs:
  verify:
    name: Verify tag, version and PyPI state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match pyproject.toml version $pkg" >&2
            exit 1
          fi
          echo "tag and packaged version agree: $pkg"

      - name: Refuse to republish an existing version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/dynachaos/$tag/json")"
          if [ "$code" = "200" ]; then
            echo "dynachaos $tag is already on PyPI; PyPI will not accept a re-upload." >&2
            echo "Bump the version rather than re-releasing this one." >&2
            exit 1
          fi
          echo "version $tag is free on PyPI (HTTP $code)"

  wheels:
    name: Build wheel (${{ matrix.target }} on ${{ matrix.os }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    env:
      # Override .cargo/config.toml target-cpu=native so wheels are portable
      # (native SIMD is correct for local dev but wrong for distribution)
      RUSTFLAGS: ""
    strategy:
      # Report every wheel target, not just the first to fail. The default
      # cancelled four of five targets the moment Windows failed, hiding
      # whether the others would have built.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: aarch64
          # x86_64 macOS is cross-compiled from the arm64 runner rather than
          # built on macos-13. GitHub retired the Intel macOS images, and a
          # macos-13 job sat unassigned for 44 minutes with started_at still
          # null, blocking the whole release: the publish job needs every
          # wheel. Apple ships a universal SDK, so rustup can target
          # x86_64-apple-darwin from an arm64 host.
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # No --no-sdist: maturin dropped that flag, and `maturin build` no
          # longer produces an sdist anyway. Passing it aborted every wheel
          # target with "unexpected argument" before any compilation started.
          #
          # --find-interpreter is required for the Linux targets. Those build
          # inside the manylinux container, which keeps its interpreters under
          # /opt/python/* and puts none of them on PATH, so maturin's default
          # search failed with "Couldn't find any python interpreters from
          # 'python3'". macOS and Windows build natively and find the runner's
          # own interpreter, which is why only Linux failed.
          args: --release --out dist --find-interpreter
          manylinux: auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Build sdist
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    # Scoped here rather than at workflow level: the build jobs have no reason
    # to be able to mint a PyPI publishing token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create the GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    # Creating a release writes to the repo, so this job -- and only this job --
    # needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
