version: 2
updates:
  # Workflow actions are SHA-pinned; Dependabot reads the trailing "# vN.M.K"
  # comment to bump the SHA while keeping the version readable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The root workspace holds rust/core and rust/py and one Cargo.lock, so one
  # entry at the workspace root covers both members.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # rust/wasm declares its own workspace and keeps its own Cargo.lock, so it
  # needs its own entry. build_wasm.py reads the wasm-bindgen version out of
  # that lock file to install a matching CLI.
  - package-ecosystem: cargo
    directory: /rust/wasm
    schedule:
      interval: weekly

  # Python deps are declared in pyproject.toml; Dependabot's Python ecosystem
  # identifier is "pip" regardless of the resolver used locally (uv).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
