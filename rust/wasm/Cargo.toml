[package]
name = "dynachaos-wasm"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false
description = "Browser surface over the dynachaos kernels: the paper's own Rust, compiled to WebAssembly."

# Its own workspace on purpose. A browser build must not depend on the state
# of the native crates or on the Python extension build.
[workspace]

[lib]
name = "dynachaos_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
# rayon is off: browser threads need SharedArrayBuffer, which needs COOP/COEP
# headers that GitHub Pages cannot set. Parallelism comes from a pool of
# workers, each computing its own tile. See docs/wasm-architecture.md.
dynachaos-core = { path = "../core", default-features = false }
ndarray = "0.17.2"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
