[project]
name = "dynachaos"
version = "0.4.1"
description = "Dynamical-systems analysis for time signals with Rust-accelerated kernels"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ricardo Frantz" }]
keywords = [
    "chaos",
    "dynamical-systems",
    "lyapunov",
    "recurrence",
    "permutation-entropy",
    "coupled-map-lattice",
    "bifurcation",
    "time-series",
    "nonlinear-dynamics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # Only versions with published wheels and CI coverage are listed. 3.15 is
    # deliberately absent: it has not been released, so its ABI is not frozen.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=2.5.1", "scipy>=1.18"]

[project.optional-dependencies]
viz = ["matplotlib>=3.11", "pillow>=12.3", "fonttools>=4.63", "brotli>=1.2.1"]
dev = ["pytest>=9.1", "maturin>=1.14,<2.0", "ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/openfluids/dynachaos"
Repository = "https://github.com/openfluids/dynachaos"
"Bug Tracker" = "https://github.com/openfluids/dynachaos/issues"

[project.scripts]
dynachaos = "dynachaos.cli:main"

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/py/Cargo.toml"
exclude = [
    "figures/**",
    "tests/**",
    "benchmarks/results/**",
    "docs/**",
    "examples/**",
]
features = ["pyo3/extension-module"]
module-name = "dynachaos._rust"
python-source = "src"

[tool.uv]
exclude-newer = "7 days"
# Security fixes younger than 7 days (Pillow 13.0.0, certifi 2026.10.19, brotli 1.2.1). Remove after 2026-10-29.
exclude-newer-package = { pillow = false, certifi = false, brotli = false }
package = true
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/core/Cargo.toml" },
    { file = "rust/core/src/**/*.rs" },
    { file = "rust/py/Cargo.toml" },
    { file = "rust/py/src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["dynachaos"]
relative_files = true
patch = ["subprocess"]
# Plot-styling wrappers around matplotlib; measured value is in the figure
# tests, not line coverage here.
omit = ["*/dynachaos/viz/*"]

[tool.coverage.report]
precision = 1

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "maturin>=1.14,<2.0",
    "ruff>=0.16",
    "fonttools>=4.63.0",
    "brotli>=1.2.1",
    "pytest-cov>=7.1.0",
]
